# Production (cluster manage) : image depuis un registre, autoscaling CPU,
# Ingress TLS. Remplacer REGISTRY et l'hote avant usage.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - hpa.yaml
  - ingress.yaml
images:
  - name: mlindustrial-api
    newName: ghcr.io/pduclos/mlindustrial-api
    newTag: "1.0.0"
patches:
  - target: {kind: Deployment, name: bearing-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
