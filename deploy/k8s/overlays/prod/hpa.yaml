apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bearing-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bearing-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
