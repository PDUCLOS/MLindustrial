# Poste local (Docker Desktop / kind) : 1 replica, 1 worker, NodePort 30765.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: bearing-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Service, name: bearing-api}
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30765
  - target: {kind: PodDisruptionBudget, name: bearing-api}
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
configMapGenerator:
  - name: bearing-api-config
    behavior: replace
    literals:
      - UVICORN_WORKERS=1
