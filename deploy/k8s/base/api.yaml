# API de diagnostic : sans etat (modele embarque dans l'image), donc
# replicable horizontalement sans volume ni base de donnees.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bearing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bearing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bearing-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mlindustrial-api
          imagePullPolicy: IfNotPresent
          args: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8765",
                 "--workers", "$(UVICORN_WORKERS)"]
          envFrom:
            - configMapRef:
                name: bearing-api-config
          ports:
            - name: http
              containerPort: 8765
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # CPU mesure en local : ~23 ms par diagnostic (docs/PORTFOLIO.md).
            # Memoire : estimation a confirmer dans l'image (non mesuree en conteneur).
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bearing-api
spec:
  selector:
    app.kubernetes.io/name: bearing-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bearing-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bearing-api
