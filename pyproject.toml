[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "vibration-predictive-maintenance"
version = "0.1.0"
description = "Analyse vibratoire et ML pour la maintenance predictive - generalisation defauts artificiels vers defauts reels"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "torch>=2.2",
    "mlflow>=2.12",
    "streamlit>=1.35",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "streamlit-flow-component>=1.0.0",
    "plotly>=5.20",
    "reportlab>=4.0",
    "python-pptx>=1.0",
    "simpy>=4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests necessitant une DB/service externe reelle"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Jeu de regles explicite : les nouvelles versions de ruff (0.16, verrouillee
# dans uv.lock) activent davantage de regles par defaut, ce qui faisait echouer
# la CI sans changement de code. Base historique + bugbear (B015/B017).
select = ["E4", "E7", "E9", "F", "B015", "B017"]

[tool.ruff.lint.per-file-ignores]
# sys.path.insert(...) avant les imports src.* : pattern volontaire de
# bootstrap utilise par tous les scripts CLI (voir docs/brief_projet.md).
"scripts/*.py" = ["E402"]
"tests/test_aas.py" = ["E402"]
