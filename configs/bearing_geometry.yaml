      src/features/fault_frequencies.py restent valables en remplacant
      n=nombre de rouleaux par rangee et d=diametre du rouleau, mais avec
      contact_angle != 0 il faut IMPERATIVEMENT passer phi_deg=12 a la formule
      (terme cos(phi) significatif). Note : pour un spherical roller, les
      rouleaux ne sont PAS en contact simultane avec les deux bagues (c'est
      la particularite cinematique du spherical) - les formules standard sont
      une approximation au premier ordre, suffisante pour la signature
      spectrale en simulation N2.

